#=================================================================================================================#
#                                               Data Configuration                                                #
#=================================================================================================================#

DATA:
  TRAINING:
    LR_DIR_PATH: /path/to/dataset/training/LR
    HR_DIR_PATH: /path/to/dataset/training/HR
  VALIDATION:
    LR_DIR_PATH: /path/to/dataset/validation/LR
    HR_DIR_PATH: /path/to/dataset/validation/HR
  TESTING:
    LR_DIR_PATH: /path/to/dataset/testing/LR
    HR_DIR_PATH: /path/to/dataset/testing/HR
  NUM_WORKERS: 8


#=================================================================================================================#
#                                               Model Configuration                                               #
#=================================================================================================================#

MODEL:
  NUM_TIMESTEPS: 1000
  BETA_SCHEDULE: 'COSINE'
  RESIDUAL_PREDICTION: True
  LR_CONDITION_ENCODING: True
  SCALE_FACTOR: 1
  NOISE_PREDICTOR:
    IN_CHANNELS: 1
    OUT_CHANNELS: 1
    NUM_INNER_FEATURES: 64
    FEATURE_MULTIPLIERS: [1, 2, 4, 8]
    NUM_RB_BLOCKS: 1
    NUM_RB_CONV_BLOCKS: 2
    ATTENTION_LEVELS: [False, False, True, True]
    NUM_ATTENTION_HEADS: 8
    NUM_GROUPS: 8
    PRE_TRAINED_PATH:
  LR_ENCODER:
    IN_CHANNELS: 1
    OUT_CHANNELS: 1
    NUM_FEATURES: 64
    NUM_RRDB_BLOCKS: 1
    NUM_RRDB_DB_BLOCKS: 2
    NUM_RRDB_DB_CONV_BLOCKS: 3
    NUM_RRDB_DB_GROWTH_FEATURES: 32
    PRE_TRAINED_PATH:

BETA_SCHEDULE_OPTIONS:
  - 'LINEAR'
  - 'COSINE'
  - 'SIGMOID'

BETA_SCHEDULE_PARAMETERS:
  LINEAR:
    BETA_START: 1.0e-4
    BETA_END: 2.0e-2
  COSINE:
    BETA_OFFSET: 8.0e-3
    BETA_MIN: 0.0
    BETA_MAX: 9.99e-1
  SIGMOID:
    START: -3
    END: 3
    TAU: 1.0
    BETA_MIN: 0.0
    BETA_MAX: 9.99e-1


#=================================================================================================================#
#                                           Learning Stage Configuration                                          #
#=================================================================================================================#

TRAINING:
  EPOCHS: 1000
  BATCH_SIZE: 8
  LR_PATCH_SIZE: [32, 32, 32]
  REPEAT_SAMPLE_FACTOR: 32
  AUGMENTATION: False
  FIX_LR_ENCODER: False
  SAVE_INTERVAL: 50

PRE_TRAINING_LR_ENCODER:
  EPOCHS: 1000
  BATCH_SIZE: 8
  REPEAT_SAMPLE_FACTOR: 1
  PERCEPTUAL_LOSS_VGG: True

OPTIMIZER:
  NOISE_PREDICTOR:
    LEARNING_RATE: 1.0e-4
    WEIGHT_DECAY: 0
    BETA_1: 0.9
    BETA_2: 0.999
  PRE_TRAIN_LR_ENCODER:
    LEARNING_RATE: 1.0e-4
    WEIGHT_DECAY: 0
    BETA_1: 0.9
    BETA_2: 0.999

SCHEDULER:
  NOISE_PREDICTOR:
    ETA_MIN: 1.0e-9
  PRE_TRAIN_LR_ENCODER:
    STEP_SIZE: 200
    GAMMA: 0.5

LOSS_WEIGHTS:
  NOISE_PREDICTOR:
    DIFFUSION_LOSS: 1.0
  PRE_TRAIN_LR_ENCODER:
    PERCEPTUAL_LOSS: 1.0e-2
    CONTENT_LOSS: 1.0


#=================================================================================================================#
#                                         Evaluation Stage Configuration                                          #
#=================================================================================================================#

VALIDATION:
  BATCH_SIZE: 1
  PATCH_SLIDING_WINDOW_BATCH_SIZE: 16

TESTING:
  BATCH_SIZE: 1
  PATCH_SLIDING_WINDOW_BATCH_SIZE: 16

#=================================================================================================================#
#                                               Data Configuration                                                #
#=================================================================================================================#

DATA:
  TRAINING:
    LR_DIR_PATH: /path/to/dataset/training/LR
    HR_DIR_PATH: /path/to/dataset/training/HR
  VALIDATION:
    LR_DIR_PATH: /path/to/dataset/validation/LR
    HR_DIR_PATH: /path/to/dataset/validation/HR
  TESTING:
    LR_DIR_PATH: /path/to/dataset/testing/LR
    HR_DIR_PATH: /path/to/dataset/testing/HR
  NUM_WORKERS: 4


#=================================================================================================================#
#                                               Model Configuration                                               #
#=================================================================================================================#

MODEL:
  GAN_TYPE: 'RELATIVISTIC_AVERAGE_LEAST_SQUARES'
  GENERATOR:
    IN_CHANNEL: 1
    OUT_CHANNEL: 1
    NUM_FEATURES: 64
    NUM_RRDB_BLOCKS: 23
    NUM_RRDB_DB_BLOCKS: 3
    NUM_RRDB_DB_CONV_BLOCKS: 5
    NUM_RRDB_DB_GROWTH_FEATURES: 32
    SCALE_FACTOR: 2
    PRE_TRAINED_PATH:
  DISCRIMINATOR:
    IN_CHANNEL: 1
    NUM_FEATURES: 64
    NUM_CONV_BLOCKS: 8
    CONV_BLOCKS_OUTPUT_SIZE: 6
    PRE_TRAINED_PATH:

GAN_TYPE_OPTIONS:
  - 'STANDARD'
  - 'RELATIVISTIC_AVERAGE_STANDARD'
  - 'RELATIVISTIC_AVERAGE_LEAST_SQUARES'
  - 'RELATIVISTIC_AVERAGE_HINGE'


#=================================================================================================================#
#                                           Learning Stage Configuration                                          #
#=================================================================================================================#

TRAINING:
  EPOCHS: 300
  BATCH_SIZE: 2
  LR_PATCH_SIZE: [-1, -1, -1]
  AUGMENTATION: True
  SAVE_INTERVAL: 5

OPTIMIZER:
  GENERATOR:
    LEARNING_RATE: 1.0e-4
    WEIGHT_DECAY: 0
    BETA_1: 0.9
    BETA_2: 0.999
  DISCRIMINATOR:
    LEARNING_RATE: 1.0e-4
    WEIGHT_DECAY: 0
    BETA_1: 0.9
    BETA_2: 0.999

SCHEDULER:
  GENERATOR:
    STEP_SIZE: 50
    GAMMA: 0.5
  DISCRIMINATOR:
    STEP_SIZE: 50
    GAMMA: 0.5

LOSS_WEIGHTS:
  GENERATOR:
    PERCEPTUAL_LOSS: 1.0
    ADVERSARIAL_LOSS: 5.0e-3
    CONTENT_LOSS: 1.0e-2
    RANGE_LOSS: 1.0e-2


#=================================================================================================================#
#                                         Evaluation Stage Configuration                                          #
#=================================================================================================================#

VALIDATION:
  BATCH_SIZE: 1

TESTING:
  BATCH_SIZE: 1

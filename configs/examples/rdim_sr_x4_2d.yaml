#=================================================================================================================#
#                                               Data Configuration                                                #
#=================================================================================================================#

DATA:
  TRAINING:
    LR_DIR_PATH: /path/to/dataset/training/LR
    HR_DIR_PATH: /path/to/dataset/training/HR
  VALIDATION:
    LR_DIR_PATH: /path/to/dataset/validation/LR
    HR_DIR_PATH: /path/to/dataset/validation/HR
  TESTING:
    LR_DIR_PATH: /path/to/dataset/testing/LR
    HR_DIR_PATH: /path/to/dataset/testing/HR
  NUM_WORKERS: 8
  GPU_IDS: ~


#=================================================================================================================#
#                                               Model Configuration                                               #
#=================================================================================================================#

MODEL:
  NUM_SPATIAL_DIMENSIONS: 2
  SCALE_FACTOR: 4
  IN_CHANNELS: 3
  OUT_CHANNELS: 3
  LR_CONDITION_ENCODING: False
  GAUSSIAN_DIFFUSION:
    NUM_TIMESTEPS: 100
    NUM_SAMPLING_TIMESTEPS: 1
    SAMPLING_TIMESTEP_SCHEDULE: 'LINEAR'
    BETA_SCHEDULE: 'CIRCULAR'
    GAMMA: 3.0
    ETA: 0.0
  NOISE_PREDICTOR:
    NUM_INNER_FEATURES: 128
    FEATURE_MULTIPLIERS: [1, 2, 4, 8]
    NUM_RB_BLOCKS: 2
    NUM_RB_CONV_BLOCKS: 2
    ATTENTION_LEVELS: [False, False, True, True]
    NUM_ATTENTION_HEADS: 16
    NUM_GROUPS: 16
    PRE_TRAINED_PATH:
  LR_ENCODER:
    NUM_FEATURES: 64
    NUM_RRDB_BLOCKS: 1
    NUM_RRDB_DB_BLOCKS: 2
    NUM_RRDB_DB_CONV_BLOCKS: 3
    NUM_RRDB_DB_GROWTH_FEATURES: 32
    PRE_TRAINED_PATH:

SAMPLING_TIMESTEP_SCHEDULE_OPTIONS:
  - 'LINEAR'
  - 'GEOMETRIC'

BETA_SCHEDULE_OPTIONS:
  - 'GENERAL_SIGMOID'
  - 'GENERAL_SIGMOID_ANTIDERIVATIVE'
  - 'CIRCULAR'
  - 'PARABOLIC'

BETA_SCHEDULE_PARAMETERS:
  GENERAL_SIGMOID:
    P: 2
  GENERAL_SIGMOID_ANTIDERIVATIVE:
    P: 10
  CIRCULAR:
    P: 5
  PARABOLIC:
    P: 2


#=================================================================================================================#
#                                           Learning Stage Configuration                                          #
#=================================================================================================================#

TRAINING:
  EPOCHS: 1000
  BATCH_SIZE: 16
  NUM_GRADIENT_ACCUMULATION_STEPS: 1
  LR_PATCH_SIZE: [32, 32]
  REPEAT_SAMPLE_FACTOR: 1
  AUGMENTATION: False
  DIFFUSION_LOSS: 'MSE'
  PERCEPTUAL_LOSS: 'LPIPS'
  FIX_LR_ENCODER: True
  SAVE_INTERVAL: 100

DIFFUSION_LOSS_OPTIONS:
  - 'MSE'
  - 'MAE'
  - 'CHARBONNIER'

PERCEPTUAL_LOSS_OPTIONS:
  - 'LPIPS'
  - 'SSIM'

PRE_TRAINING_LR_ENCODER:
  EPOCHS: -1
  BATCH_SIZE: 16
  NUM_GRADIENT_ACCUMULATION_STEPS: 1
  REPEAT_SAMPLE_FACTOR: 1

OPTIMIZER:
  NOISE_PREDICTOR:
    LEARNING_RATE: 1.0e-4
    WEIGHT_DECAY: 0
    BETA_1: 0.9
    BETA_2: 0.999
  PRE_TRAIN_LR_ENCODER:
    LEARNING_RATE: 1.0e-4
    WEIGHT_DECAY: 0
    BETA_1: 0.9
    BETA_2: 0.999

SCHEDULER:
  NOISE_PREDICTOR:
    ETA_MIN: 1.0e-7
  PRE_TRAIN_LR_ENCODER:
    STEP_SIZE: 200
    GAMMA: 0.5

LOSS_WEIGHTS:
  NOISE_PREDICTOR:
    DIFFUSION_LOSS: 1.0
    PERCEPTUAL_LOSS: 5.0e-2
  PRE_TRAIN_LR_ENCODER:
    CONTENT_LOSS: 1.0
    PERCEPTUAL_LOSS: 1.0e-2


#=================================================================================================================#
#                                         Evaluation Stage Configuration                                          #
#=================================================================================================================#

VALIDATION:
  BATCH_SIZE: 1
  PATCH_SLIDING_WINDOW_BATCH_SIZE: 16

TESTING:
  BATCH_SIZE: 1
  PATCH_SLIDING_WINDOW_BATCH_SIZE: 16
  TEST_TIME_AUGMENTATION: False

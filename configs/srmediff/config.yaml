#=================================================================================================================#
#                                               Data Configuration                                                #
#=================================================================================================================#

DATA:
  TRAINING:
    LR_DIR_PATH: /path/to/dataset/training/LR
    HR_DIR_PATH: /path/to/dataset/training/HR
  VALIDATION:
    LR_DIR_PATH: /path/to/dataset/validation/LR
    HR_DIR_PATH: /path/to/dataset/validation/HR
  TESTING:
    LR_DIR_PATH: /path/to/dataset/testing/LR
    HR_DIR_PATH: /path/to/dataset/testing/HR
  NUM_WORKERS: 8


#=================================================================================================================#
#                                               Model Configuration                                               #
#=================================================================================================================#

MODEL:
  NUM_TIMESTEPS: 1000
  BETA_SCHEDULE: 'COSINE'
  RESIDUAL_PREDICTION: True
  CONDITION_ENCODING: True
  SCALE_FACTOR: 2
  NOISE_PREDICTOR:
    IN_CHANNELS: 1
    OUT_CHANNELS: 1
    NUM_INNER_FEATURES: 64
    FEATURE_MULTIPLIERS: [1, 2, 4, 8]
    NUM_RDB_BLOCKS: 2
    NUM_RDB_CONV_BLOCKS: 5
    NUM_RDB_GROWTH_FEATURES: 32
    ATTENTION_LEVELS: [False, False, True, True]
    NUM_ATTENTION_HEADS: 8
    NUM_GROUPS: 32
    PRE_TRAINED_PATH:
  LR_ENCODER:
    IN_CHANNELS: 1
    OUT_CHANNELS: 1
    NUM_FEATURES: 64
    NUM_RRDB_BLOCKS: 23
    NUM_RRDB_DB_BLOCKS: 3
    NUM_RRDB_DB_CONV_BLOCKS: 5
    NUM_RRDB_DB_GROWTH_FEATURES: 32
    PRE_TRAINED_PATH:
  FEATURE_EXTRACTOR:
    PRE_TRAINED_PATH:

BETA_SCHEDULE_OPTIONS:
  - 'LINEAR'
  - 'COSINE'
  - 'SIGMOID'

BETA_SCHEDULE_PARAMETERS:
  LINEAR:
    BETA_START: 1.0e-4
    BETA_END: 2.0e-2
  COSINE:
    BETA_OFFSET: 8.0e-3
    BETA_MIN: 0.0
    BETA_MAX: 9.99e-1
  SIGMOID:
    START: -3
    END: 3
    TAU: 1.0
    BETA_MIN: 0.0
    BETA_MAX: 9.99e-1


#=================================================================================================================#
#                                           Learning Stage Configuration                                          #
#=================================================================================================================#

TRAINING:
  EPOCHS: 300
  BATCH_SIZE: 2
  LR_PATCH_SIZE: [-1, -1, -1]
  AUGMENTATION: False
  SAVE_INTERVAL: 5

OPTIMIZER:
  LEARNING_RATE: 1.0e-4
  WEIGHT_DECAY: 0
  BETA_1: 0.9
  BETA_2: 0.999

SCHEDULER:
  T_0: 25
  T_MULT: 4
  ETA_MIN: 1.0e-9

LOSS_WEIGHTS:
  PERCEPTUAL_LOSS: 1.0e-2
  DIFFUSION_LOSS: 1.0
  CONTENT_LOSS: 1.0e-2


#=================================================================================================================#
#                                         Evaluation Stage Configuration                                          #
#=================================================================================================================#

VALIDATION:
  BATCH_SIZE: 1

TESTING:
  BATCH_SIZE: 1

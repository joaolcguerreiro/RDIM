    IN_CHANNEL: 1
    OUT_CHANNEL: 1
    NUM_FEATURES: 64
    NUM_RRDB_BLOCKS: 23
    NUM_RRDB_DB_BLOCKS: 3
    NUM_RRDB_DB_CONV_BLOCKS: 5

  PRE_TRAINED_PATH:     # Whole Network Weights


#=================================================================================================================#
#                                           Learning Stage Configuration                                          #
#=================================================================================================================#

TRAINING:
  EPOCHS: 5000
  BATCH_SIZE: 8
  AUGMENTATION: True
  SAVE_INTERVAL: 50

OPTIMIZER:
  GENERATOR:
    LEARNING_RATE: 1e-4
    WEIGHT_DECAY: 0
    BETA_1: 0.9
    BETA_2: 0.999
  DISCRIMINATOR:
    LEARNING_RATE: 1e-4
    WEIGHT_DECAY: 0
    BETA_1: 0.9
    BETA_2: 0.999

LOSS_WEIGHTS:
  GENERATOR:
    CONTENT_LOSS: 1e-2
    ADVERSARIAL_LOSS: 5e-3


#=================================================================================================================#
#                                         Evaluation Stage Configuration                                          #
#=================================================================================================================#

VALIDATION:
  BATCH_SIZE: 8

TESTING:
  BATCH_SIZE: 8
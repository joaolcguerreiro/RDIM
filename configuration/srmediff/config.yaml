    LR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/training/LR
    HR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/training/HR
  VALIDATION:
    LR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/validation/LR
    HR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/validation/HR
  TESTING:
    LR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/testing/LR
    HR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/testing/HR
  NUM_WORKERS: 4


#=================================================================================================================#
#                                               Model Configuration                                               #
#=================================================================================================================#

MODEL:
  NUM_STEPS: 1000
  BETA_SCHEDULE: 'COSINE'
  RESIDUAL_PREDICTION: True
  SCALE_FACTOR: 2
  BETA_SCHEDULE_PARAMETERS:
    COSINE:
      BETA_OFFSET: 8.0e-3
      BETA_MAX: 9.99e-1
    LINEAR:
      BETA_START: 1.0e-4
      BETA_END: 2.0e-2
  NOISE_PREDICTOR:
    IN_CHANNEL:
    ...
    PRE_TRAINED_PATH:
  LR_ENCODER:
    PRE_TRAINED_PATH:
  FEATURE_EXTRACTOR:
    PRE_TRAINED_PATH:
  PRE_TRAINED_PATH:     # Whole Network Weights


#=================================================================================================================#
#                                           Learning Stage Configuration                                          #
#=================================================================================================================#

TRAINING:
  EPOCHS: 500
  BATCH_SIZE: 8
  WARMUP_STEPS: 5 # TODO
  GRADIENT_ACCUMULATION_STEPS: 1 # TODO
  AUGMENTATION: True
  SAVE_INTERVAL: 5

OPTIMIZER:
  LEARNING_RATE: 1.0e-4
  WEIGHT_DECAY: 0
  BETA_1: 0.9
  BETA_2: 0.999

SCHEDULER:
  STEP_SIZE: 50
  GAMMA: 0.5

LOSS_WEIGHTS:
  PERCEPTUAL_LOSS: 1.0
  DIFFUSION_LOSS: 1.0
  CONTENT_LOSS: 1.0e-2


#=================================================================================================================#
#                                         Evaluation Stage Configuration                                          #
#=================================================================================================================#

VALIDATION:
  BATCH_SIZE: 8

TESTING:
  BATCH_SIZE: 8

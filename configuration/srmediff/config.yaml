#=================================================================================================================#
#                                               Data Configuration                                                #
#=================================================================================================================#

DATA:
  TRAINING:
    LR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/training/LR
    HR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/training/HR
  VALIDATION:
    LR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/validation/LR
    HR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/validation/HR
  TESTING:
    LR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/testing/LR
    HR_DIR_PATH: /Users/joaoguerreiro/Documents/Research/SRMeDiff/code/SRMeDiff/data/testing/HR
  NUM_WORKERS: 4


#=================================================================================================================#
#                                               Model Configuration                                               #
#=================================================================================================================#

MODEL:
  NUM_STEPS: 1000
  BETA_SCHEDULE: 'COSINE'
  RESIDUAL_PREDICTION: True
  CONDITION_ENCODING: True
  SCALE_FACTOR: 2
  NOISE_PREDICTOR:
    IN_CHANNEL: 1
    OUT_CHANNEL: 1
    NUM_INNER_FEATURES: 64
    FEATURE_MULTIPLIERS: [1, 2, 4, 8]
    NUM_RDB_BLOCKS: 2
    NUM_RDB_CONV_BLOCKS: 5
    NUM_RDB_GROWTH_FEATURES: 32
    NUM_GROUPS: 32
    ATTENTION_LAYERS: [False, False, True, True]
    NUM_ATTENTION_HEADS: 8
    RAW_LR_CONDITION: False
    PRE_TRAINED_PATH:
  LR_ENCODER:
    PRE_TRAINED_PATH:
  FEATURE_EXTRACTOR:
    PRE_TRAINED_PATH:
  PRE_TRAINED_PATH:     # Whole Network Weights

BETA_SCHEDULE_PARAMETERS:
  LINEAR:
    BETA_START: 1.0e-4
    BETA_END: 2.0e-2
  COSINE:
    BETA_OFFSET: 8.0e-3
    BETA_MIN: 0.0
    BETA_MAX: 9.99e-1
  SIGMOID:
    START: -3
    END: 3
    TAU: 1.0
    BETA_MIN: 0.0
    BETA_MAX: 9.99e-1


#=================================================================================================================#
#                                           Learning Stage Configuration                                          #
#=================================================================================================================#

TRAINING:
  EPOCHS: 500
  BATCH_SIZE: 8
  AUGMENTATION: True
  SAVE_INTERVAL: 5

OPTIMIZER:
  LEARNING_RATE: 1.0e-4
  WEIGHT_DECAY: 0
  BETA_1: 0.9
  BETA_2: 0.999

SCHEDULER:
  STEP_SIZE: 50
  GAMMA: 0.5

LOSS_WEIGHTS:
  PERCEPTUAL_LOSS: 1.0
  DIFFUSION_LOSS: 1.0
  CONTENT_LOSS: 1.0e-2


#=================================================================================================================#
#                                         Evaluation Stage Configuration                                          #
#=================================================================================================================#

VALIDATION:
  BATCH_SIZE: 8

TESTING:
  BATCH_SIZE: 8
